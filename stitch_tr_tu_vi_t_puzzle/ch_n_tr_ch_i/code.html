<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chọn Thử Thách - Trò Chơi Dân Gian</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;family=Be+Vietnam+Pro:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#012202",
                        "on-primary-fixed-variant": "#930004",
                        "on-primary": "#ffffff",
                        "background": "#fff9ea",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#ffb4a9",
                        "on-tertiary-container": "#e1ffd5",
                        "tertiary": "#3e6137",
                        "on-primary-fixed": "#410001",
                        "inverse-surface": "#333027",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f9f3e4",
                        "inverse-on-surface": "#f6f0e1",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e8e2d3",
                        "on-surface-variant": "#5d403b",
                        "surface-dim": "#dfdacb",
                        "surface-variant": "#e8e2d3",
                        "surface-container": "#f3edde",
                        "outline-variant": "#e6bdb7",
                        "surface-tint": "#bf080b",
                        "primary-fixed": "#ffdad5",
                        "tertiary-fixed-dim": "#a9d19e",
                        "secondary-fixed-dim": "#cdcd00",
                        "tertiary-fixed": "#c4eeb8",
                        "secondary-container": "#e7e700",
                        "on-surface": "#1d1c13",
                        "secondary-fixed": "#eaea00",
                        "on-error": "#ffffff",
                        "on-primary-container": "#fff3f1",
                        "surface-bright": "#fff9ea",
                        "surface-container-high": "#eee8d9",
                        "on-secondary-fixed": "#1d1d00",
                        "primary-fixed-dim": "#ffb4a9",
                        "surface": "#fff9ea",
                        "on-background": "#1d1c13",
                        "primary": "#b40006",
                        "on-tertiary-fixed-variant": "#2c4f27",
                        "on-secondary-container": "#666600",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#494900",
                        "secondary": "#626200",
                        "outline": "#916f6a",
                        "primary-container": "#da251d",
                        "tertiary-container": "#557a4e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "unit": "8px",
                        "margin-desktop": "40px",
                        "container-max-width": "1200px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "game-logic": ["JetBrains Mono"],
                        "display-lg-mobile": ["Be Vietnam Pro"],
                        "body-sm": ["Be Vietnam Pro"],
                        "headline-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "game-logic": ["16px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            /* Banana Leaf subtle pattern */
            background-color: theme('colors.background');
            background-image: radial-gradient(theme('colors.surface-variant') 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .card-border-gradient {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.secondary-container'));
            padding: 2px;
            border-radius: theme('borderRadius.xl');
        }
        .inner-card {
            background-color: theme('colors.surface-container-lowest');
            border-radius: calc(theme('borderRadius.xl') - 2px);
        }
        .tactile-button {
            border-bottom-width: 4px;
            border-color: theme('colors.on-primary-fixed-variant');
            transition: all 0.1s ease-in-out;
        }
        .tactile-button:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
    </style>
</head>
<body class="min-h-screen text-on-surface flex flex-col font-body-lg text-body-lg">
<!-- Header (Suppressed default navigation since this is a focused linear selection, but retaining brand anchor) -->
<header class="w-full flex items-center justify-between px-margin-mobile py-4 bg-surface shadow-sm sticky top-0 z-50">
<button aria-label="Go back" class="text-primary hover:bg-primary-container/10 p-2 rounded-full transition-colors flex items-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary uppercase tracking-widest text-center flex-grow">CHỌN THỬ THÁCH</h1>
<div class="w-10"></div> <!-- Balancer for centering -->
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile w-full max-w-container-max-width mx-auto">
<!-- Bento Grid for Game Selection -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter w-full max-w-3xl mt-8">
<!-- Game Card: 2048 -->
<button class="card-border-gradient text-left group hover:-translate-y-1 transition-transform duration-300 focus:outline-none focus:ring-4 focus:ring-primary-container focus:ring-opacity-50 rounded-xl shadow-lg shadow-on-surface-variant/20">
<div class="inner-card w-full h-full p-6 flex items-center space-x-6">
<div class="bg-surface-variant p-4 rounded-lg flex-shrink-0 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">grid_4x4</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 group-hover:text-primary transition-colors">2048</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Kết hợp các ô số để đạt 2048.</p>
<div class="mt-2 inline-block px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant font-game-logic text-game-logic rounded text-xs uppercase">Trí tuệ</div>
</div>
</div>
</button>
<!-- Game Card: Sudoku -->
<button class="card-border-gradient text-left group hover:-translate-y-1 transition-transform duration-300 focus:outline-none focus:ring-4 focus:ring-primary-container focus:ring-opacity-50 rounded-xl shadow-lg shadow-on-surface-variant/20">
<div class="inner-card w-full h-full p-6 flex items-center space-x-6">
<div class="bg-surface-variant p-4 rounded-lg flex-shrink-0 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 group-hover:text-primary transition-colors">Sudoku</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Điền số logic vào lưới 9x9.</p>
<div class="mt-2 inline-block px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant font-game-logic text-game-logic rounded text-xs uppercase">Logic</div>
</div>
</div>
</button>
<!-- Game Card: Sokoban -->
<button class="card-border-gradient text-left group hover:-translate-y-1 transition-transform duration-300 focus:outline-none focus:ring-4 focus:ring-primary-container focus:ring-opacity-50 rounded-xl shadow-lg shadow-on-surface-variant/20">
<div class="inner-card w-full h-full p-6 flex items-center space-x-6">
<div class="bg-surface-variant p-4 rounded-lg flex-shrink-0 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">widgets</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 group-hover:text-primary transition-colors">Sokoban</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Đẩy thùng vào đúng vị trí đích.</p>
<div class="mt-2 inline-block px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant font-game-logic text-game-logic rounded text-xs uppercase">Giải đố</div>
</div>
</div>
</button>
<!-- Game Card: Nonogram -->
<button class="card-border-gradient text-left group hover:-translate-y-1 transition-transform duration-300 focus:outline-none focus:ring-4 focus:ring-primary-container focus:ring-opacity-50 rounded-xl shadow-lg shadow-on-surface-variant/20">
<div class="inner-card w-full h-full p-6 flex items-center space-x-6">
<div class="bg-surface-variant p-4 rounded-lg flex-shrink-0 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">border_all</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1 group-hover:text-primary transition-colors">Nonogram</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tô màu ô trống theo số liệu.</p>
<div class="mt-2 inline-block px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant font-game-logic text-game-logic rounded text-xs uppercase">Logic hình</div>
</div>
</div>
</button>
</div>
</main>
</body></html>
