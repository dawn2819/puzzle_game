<script>
        // Simple Confetti Animation
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['bg-primary-container', 'bg-secondary-container', 'bg-tertiary-fixed-dim', 'bg-primary'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize appearance
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                
                // Add keyframes dynamically for falling
                confetti.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1, top: '-20px' },
                    { transform: `translate3d(${Math.random() * 100 - 50}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0, top: '100vh' }
                ], {
                    duration: Math.random() * 2000 + 2000, // 2-4 seconds
                    delay: Math.random() * 500,
                    iterations: 1,
                    fill: 'forwards'
                });

                container.appendChild(confetti);
            }
        }

        // Run animation on load
        window.addEventListener('DOMContentLoaded', createConfetti);
    </script>
