<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>2048 - Trí Tuệ Việt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        body {
            background-color: theme('colors.background');
            background-image: radial-gradient(theme('colors.surface-variant') 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .game-board {
            box-shadow: inset 0 4px 6px -1px rgba(0, 0, 0, 0.1), inset 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: theme('colors.surface-container-high');
        }

        .tile {
            transition: all 0.15s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .tile:active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Tile Colors mapping based on the design system */
        .tile-2 { background-color: theme('colors.surface-container'); color: theme('colors.on-surface'); }
        .tile-4 { background-color: theme('colors.surface-variant'); color: theme('colors.on-surface'); }
        .tile-8 { background-color: theme('colors.secondary-container'); color: theme('colors.on-secondary-container'); }
        .tile-16 { background-color: theme('colors.secondary'); color: theme('colors.on-secondary'); }
        .tile-32 { background-color: theme('colors.primary-fixed-dim'); color: theme('colors.on-primary-fixed'); }
        .tile-64 { background-color: theme('colors.primary-fixed'); color: theme('colors.on-primary-fixed'); }
        .tile-128 { background-color: theme('colors.primary-container'); color: theme('colors.on-primary-container'); }
        .tile-256 { background-color: theme('colors.primary'); color: theme('colors.on-primary'); box-shadow: 0 0 15px theme('colors.primary'); }

        .btn-primary {
            border-bottom-width: 4px;
            border-bottom-color: theme('colors.on-primary-fixed-variant');
        }
        .btn-primary:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
        
        .btn-secondary {
            border-bottom-width: 4px;
            border-bottom-color: theme('colors.on-surface-variant');
        }
        .btn-secondary:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen text-on-surface font-body-lg pb-[80px] md:pb-0 overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Desktop) / App Bar (Mobile) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface border-b border-surface-variant shadow-sm hidden md:flex">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-primary-container/10 p-2 rounded-full transition-colors" data-icon="menu">menu</span>
<h1 class="text-headline-md font-headline-md font-extrabold text-primary uppercase tracking-widest">TRÒ CHƠI DÂN GIAN</h1>
</div>
<div class="flex items-center gap-6">
<nav class="flex gap-6">
<a class="text-on-surface-variant hover:bg-primary-container/10 transition-colors px-3 py-2 rounded-lg" href="#">Trang Chủ</a>
<a class="text-primary font-bold hover:bg-primary-container/10 transition-colors px-3 py-2 rounded-lg" href="#">Thử Thách</a>
<a class="text-on-surface-variant hover:bg-primary-container/10 transition-colors px-3 py-2 rounded-lg" href="#">Xếp Hạng</a>
</nav>
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-primary-container/10 p-2 rounded-full transition-colors" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Game Container -->
<main class="max-w-container-max-width mx-auto px-margin-mobile pt-8 md:pt-24 min-h-[calc(100vh-80px)] flex flex-col items-center justify-center">
<!-- Game Header & Scores -->
<div class="w-full max-w-[500px] flex justify-between items-end mb-8">
<div class="flex-1">
<h2 class="text-display-lg-mobile md:text-display-lg font-display-lg-mobile md:font-display-lg text-primary mb-2">2048</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant uppercase tracking-wider font-bold">Trí Tuệ Việt</p>
</div>
<div class="flex gap-3">
<div class="bg-surface-variant rounded-xl p-3 flex flex-col items-center min-w-[80px] shadow-sm border border-outline-variant/30">
<span class="text-[12px] font-bold text-on-surface-variant uppercase tracking-widest">Điểm</span>
<span class="text-headline-md font-game-logic font-bold text-on-surface">1450</span>
</div>
<div class="bg-primary-container rounded-xl p-3 flex flex-col items-center min-w-[80px] shadow-sm border border-primary/30 relative overflow-hidden group">
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMTAiIGN5PSIxMCIgcj0iMiIgZmlsbD0iI2ZmZmZmZiIgb3BhY2l0eT0iMC4yIi8+PC9zdmc+')] opacity-30"></div>
<span class="text-[12px] font-bold text-on-primary-container uppercase tracking-widest z-10">Kỷ Lục</span>
<span class="text-headline-md font-game-logic font-bold text-on-primary-container z-10">8420</span>
</div>
</div>
</div>
<!-- Controls / Actions -->
<div class="w-full max-w-[500px] flex justify-between items-center mb-6">
<p class="text-body-sm font-body-sm text-on-surface-variant">Ghép các số giống nhau để đạt <span class="font-bold text-primary">2048!</span></p>
<div class="flex gap-2">
<button class="btn-secondary bg-surface-container hover:bg-surface-container-highest text-on-surface font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="undo">undo</span>
</button>
<button class="btn-primary bg-primary hover:bg-surface-tint text-on-primary font-bold py-2 px-6 rounded-lg flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
<span>Chơi Lại</span>
</button>
</div>
</div>
<!-- Game Board (Bento Grid Style) -->
<div class="game-board rounded-[24px] p-3 w-full max-w-[500px] aspect-square grid grid-cols-4 grid-rows-4 gap-3 relative">
<!-- Grid Background Cells -->
<!-- Row 1 -->
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<!-- Row 2 -->
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<!-- Row 3 -->
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<!-- Row 4 -->
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<div class="bg-surface-container-low rounded-xl"></div>
<!-- Active Tiles (Absolute positioned over the grid for animation purposes in real implementation, but placed in grid for this mockup) -->
<!-- Example Tile 2 -->
<div class="tile tile-2 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-3 left-3 rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer" style="background-color: #fef3c7; color: #92400e; border: 2px solid #fde68a;">
                2
            </div>
<!-- Example Tile 4 -->
<div class="tile tile-4 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-3 left-[calc(25%+3px)] rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer" style="background-color: #fde68a; color: #92400e; border: 2px solid #fcd34d;">
                4
            </div>
<!-- Example Tile 8 -->
<div class="tile tile-8 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-3 left-[calc(50%+3px)] rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer relative overflow-hidden" style="background-color: #f97316; color: #ffffff; border: 2px solid #ea580c;">
<span class="z-10">8</span>
<div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTIwIDAgTDIwIDQwIE0wIDIwIEw0MCAyMCIgc3Ryb2tlPSIjMDAwIiBzdHJva2Utd2lkdGg9IjIiLz48L3N2Zz4=')] bg-center"></div>
</div>
<!-- Example Tile 16 -->
<div class="tile tile-16 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-[calc(25%+3px)] left-3 rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer" style="background-color: #ea580c; color: #ffffff; border: 2px solid #c2410c;">
                16
            </div>
<!-- Example Tile 32 -->
<div class="tile tile-32 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-[calc(50%+3px)] left-[calc(50%+3px)] rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer" style="background-color: #ef4444; color: #ffffff; border: 2px solid #dc2626;">
                32
            </div>
<!-- Example Tile 64 -->
<div class="tile tile-64 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-[calc(75%+3px)] left-[calc(25%+3px)] rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer" style="background-color: #dc2626; color: #ffffff; border: 2px solid #b91c1c;">
                64
            </div>
<!-- Example Tile 128 -->
<div class="tile tile-128 absolute w-[calc(25%-9px)] h-[calc(25%-9px)] top-[calc(75%+3px)] left-[calc(50%+3px)] rounded-xl flex items-center justify-center font-game-logic text-headline-md font-bold cursor-pointer" style="background-color: #991b1b; color: #ffffff; border: 2px solid #7f1d1d; box-shadow: 0 0 15px rgba(153, 27, 27, 0.4);">
                128
            </div>
</div>
</main>
<!-- Bottom Navigation Bar (Mobile only) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile pb-2 pt-1 bg-surface-container shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:text-primary group" href="#">
<div class="group-hover:bg-primary-container/10 px-4 py-1 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<span class="text-body-sm font-body-sm mt-1">Trang Chủ</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="extension" style="font-variation-settings: 'FILL' 1;">extension</span>
<span class="text-body-sm font-body-sm mt-1 font-bold">Thử Thách</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:text-primary group" href="#">
<div class="group-hover:bg-primary-container/10 px-4 py-1 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
</div>
<span class="text-body-sm font-body-sm mt-1">Xếp Hạng</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 hover:text-primary group" href="#">
<div class="group-hover:bg-primary-container/10 px-4 py-1 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
<span class="text-body-sm font-body-sm mt-1">Cài Đặt</span>
</a>
</nav>
</body></html>
